<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Hello, world! | Hariharan</title>
	<style>
		* { box-sizing: border-box; }
		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 24px;
			color: #1d2939;
			background: linear-gradient(135deg, #e8f5ff, #f3efff);
			font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
		}
		main {
			width: min(100%, 600px);
			padding: clamp(32px, 8vw, 60px);
			text-align: center;
			background: #fff;
			border: 1px solid #e5eaf1;
			border-radius: 24px;
			box-shadow: 0 20px 55px rgb(29 41 57 / 10%);
		}
		.label {
			margin: 0 0 16px;
			color: #5b55c8;
			font-size: .8rem;
			font-weight: 700;
			letter-spacing: .12em;
			text-transform: uppercase;
		}
		h1 { margin: 0; font-size: clamp(2.5rem, 9vw, 4.25rem); letter-spacing: -.05em; }
		.welcome { margin: 18px auto 28px; max-width: 420px; color: #667085; line-height: 1.7; }
		a {
			display: inline-block;
			padding: 12px 20px;
			color: #fff;
			background: #5b55c8;
			border-radius: 10px;
			font-weight: 600;
			text-decoration: none;
		}
		a:hover, a:focus-visible { background: #4540a6; }
	</style>
</head>
<body>
	<main>
		<p class="label">Personal profile</p>
		<h1>Hello, world!</h1>
		<p class="welcome">Hi, I'm Hariharan. Welcome to my little corner of the internet. This is a simple test page—more about me coming soon.</p>
		<a href="mailto:hello@example.com">Say hello</a>
	</main>
</body>
</html>
